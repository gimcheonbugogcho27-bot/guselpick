<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>구슬 뽑기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 경기장(캔버스)이 왼쪽 주인공, 설정 패널이 오른쪽. 좁은 화면에서는 경기장이 위, 설정이 아래. */
:root{
  --bg:#EDF0F7; --panel:#FFFFFF; --ink:#16203A; --muted:#5C6786; --line:#D9DFEC;
  --accent:#2F4BFF; --accent-ink:#FFFFFF; --stage:#F7F9FD; --wall:#9AA6C4; --peg:#6B7A9E; --field:#F2F4FA;
  --good:#1E9E5A;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1424; --panel:#171E33; --ink:#E8ECF8; --muted:#9AA5C4; --line:#2A3352;
    --accent:#7C8CFF; --accent-ink:#0F1424; --stage:#0C1020; --wall:#5A6690; --peg:#8A97BD; --field:#1F2740;
    --good:#4ADE80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1424; --panel:#171E33; --ink:#E8ECF8; --muted:#9AA5C4; --line:#2A3352;
  --accent:#7C8CFF; --accent-ink:#0F1424; --stage:#0C1020; --wall:#5A6690; --peg:#8A97BD; --field:#1F2740;
  --good:#4ADE80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr);}
@media (min-width:900px){.wrap{grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);align-items:start}.head{grid-column:1/-1}}
.head h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.01em;line-height:1.15}
.head p{margin:4px 0 0;color:var(--muted)}
.stage-col{display:grid;gap:12px;min-width:0}
.stage{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--stage);aspect-ratio:3/4;max-height:78vh;margin-inline:auto;width:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
.rank{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:44%}
.rank .chip{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;font-size:12px;font-weight:500;min-width:0}
.rank .chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .chip b{font-family:var(--display);font-weight:400;color:var(--muted);min-width:1.1em;text-align:center}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:var(--c,#888);color:#fff;display:inline-grid;place-items:center;font-family:var(--display);font-size:14px;overflow:hidden;border:2px solid var(--c,#888)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--stage) 72%,transparent);padding:16px}
.overlay[hidden]{display:none!important}
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(100%,360px);max-height:100%;overflow:auto;text-align:center}
.result h2{font-family:var(--display);font-weight:400;margin:0 0 10px;font-size:24px}
.winners{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}
.winner{display:grid;gap:4px;justify-items:center;width:84px}
.winner .av{width:72px;height:72px;font-size:30px;border-width:4px}
.winner small{color:var(--muted);font-size:12px}
.winner strong{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:9px 14px;min-height:40px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.primary:hover{filter:brightness(1.06)}
button:disabled{opacity:.5;cursor:not-allowed}
.big{flex:1;min-height:48px;font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.group{display:grid;gap:8px}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 6px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.maps button{text-align:left;display:grid;gap:2px;padding:10px 12px}
.maps button small{color:var(--muted);font-size:12px}
.maps button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:64px;text-align:center}
.plist{display:grid;gap:6px;max-height:420px;overflow:auto;padding-right:2px}
.prow{display:flex;gap:8px;align-items:center}
.prow .pick{padding:0;border:0;background:none;min-height:0;position:relative;flex:none;border-radius:50%}
.prow .pick .av{width:44px;height:44px;font-size:18px}
.prow .pick i{position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:12px;line-height:1;font-weight:700;border:2px solid var(--panel)}
.prow input{flex:1}
.prow .x{padding:4px 10px;min-height:36px;color:var(--muted)}
.prow .clr{padding:4px 8px;min-height:36px;font-size:12px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.toast{color:var(--good);font-size:13px;min-height:1.2em;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <h1>구슬 뽑기</h1>
    <p>참여자마다 구슬에 이미지를 넣고, 레이스 결과로 당첨자를 정합니다.</p>
  </header>

  <section class="stage-col" aria-label="경기장">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="구슬 레이스 화면"></canvas>
      <div class="rank" id="rank" aria-live="off"></div>
      <div class="overlay" id="ov" hidden>
        <div class="result" role="dialog" aria-label="결과">
          <h2 id="ovTitle">당첨!</h2>
          <div class="winners" id="winners"></div>
          <div class="row">
            <button class="primary" id="copyBtn" type="button">결과 복사</button>
            <button id="againBtn" type="button">다시 하기</button>
          </div>
          <textarea id="copyBox" readonly hidden style="margin-top:10px"></textarea>
        </div>
      </div>
    </div>
    <div class="bar">
      <button class="primary big" id="startBtn" type="button">구슬 떨어뜨리기</button>
      <button id="resetBtn" type="button">처음 위치로</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </section>

  <aside class="panel" aria-label="설정">
    <div class="group">
      <div class="label">맵</div>
      <div class="maps" id="maps"></div>
    </div>

    <div class="group">
      <div class="label">방식</div>
      <div class="seg" id="modeSeg">
        <button type="button" data-v="first" aria-pressed="true">먼저 도착</button>
        <button type="button" data-v="last" aria-pressed="false">마지막 도착</button>
      </div>
      <div class="meta">
        <div class="stepper">
          <span>당첨 인원</span>
          <button type="button" id="wMinus" aria-label="당첨 인원 줄이기">−</button>
          <input type="number" id="wNum" min="1" value="1" inputmode="numeric">
          <button type="button" id="wPlus" aria-label="당첨 인원 늘리기">+</button>
        </div>
      </div>
      <div class="label" style="margin-top:4px">속도</div>
      <div class="seg" id="speedSeg">
        <button type="button" data-v="1" aria-pressed="true">1배</button>
        <button type="button" data-v="2" aria-pressed="false">2배</button>
        <button type="button" data-v="4" aria-pressed="false">4배</button>
      </div>
    </div>

    <div class="group">
      <div class="meta">
        <div class="label">참여자</div>
        <div class="count" id="pcount"></div>
      </div>
      <div class="bar">
        <input type="text" id="addName" placeholder="이름 입력 후 Enter" maxlength="20" style="flex:1">
        <button type="button" id="addBtn">추가</button>
      </div>
      <div class="bar">
        <button type="button" id="bulkToggle">여러 명 붙여넣기</button>
        <button type="button" id="multiImg">이미지 여러 장 올리기</button>
        <input type="file" id="multiFile" accept="image/*" multiple hidden>
        <input type="file" id="oneFile" accept="image/*" hidden>
      </div>
      <div class="group" id="ghBox">
        <div class="label">GitHub 이미지로 참여자 만들기</div>
        <input type="text" id="ghUrl" placeholder="https://github.com/아이디/저장소/tree/main/images" aria-label="GitHub 폴더 주소" autocomplete="off">
        <div class="bar">
          <button type="button" class="primary" id="ghLoad">GitHub에서 불러오기</button>
          <button type="button" id="zipBtn">ZIP 불러오기</button>
          <button type="button" id="dirBtn">폴더 선택</button>
        </div>
        <label class="chk"><input type="checkbox" id="replaceList" checked> 기존 참여자를 비우고 불러오기</label>
        <p class="hint" id="ghMsg" role="status">파일 이름이 그대로 참여자 이름이 됩니다. 예: 01_민준.png → 민준</p>
        <input type="file" id="zipFile" accept=".zip,application/zip" hidden>
        <input type="file" id="dirFile" webkitdirectory multiple hidden>
      </div>
      <div id="bulkBox" hidden class="group">
        <textarea id="bulkText" placeholder="한 줄에 한 명씩 입력하세요"></textarea>
        <button type="button" id="bulkAdd">목록에 추가</button>
      </div>
      <p class="hint">참여자 이름 칸을 눌러 바로 수정할 수 있어요. 이미지 여러 장은 파일 이름이 참여자 이름과 같으면 자동으로 연결되고, 없으면 새 참여자로 추가됩니다.</p>
      <div class="plist" id="plist"></div>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.31/dist/planck.min.js"></script>

  var $ = function(id){return document.getElementById(id)};

  /* ---------- 이미지 ---------- */

  /* ---------- 월드 ---------- */
  var W = null;
  var T = {};
  function readTheme(){
    var cs = getComputedStyle(document.documentElement);
    ['stage','wall','peg','accent','ink','muted','panel'].forEach(function(k){ T[k] = cs.getPropertyValue('--'+k).trim(); });
  }

  function radiusFor(n){ return n<=8?14 : n<=16?12 : n<=30?10 : n<=50?8 : 6; }

  function buildWorld(){
    var def = MAPS.filter(function(m){return m.id===S.map})[0] || MAPS[0];
    S.map = def.id;
    WW = def.W;
    var n = S.people.length;
    var r = radiusFor(n);
    var cell = 2*r+3;
    var cols = Math.max(1, Math.floor((WW-2*r-4)/cell));
    var rows = Math.max(1, Math.ceil(n/cols));
    var hy = 30 + rows*cell + r;
    var k = def.k;
    function X(ix){ return (ix-def.cx)*k + WW/2; }
    var exL = X(def.entL), exR = X(def.entR);
    var yBase = hy + 90;
    function Y(iy){ return yBase + (iy-def.y0)*k; }
    var w = {r:r, hy:hy, pegs:[], bumpers:[], segs:[], spin:[], polys:[], marbles:[], finished:[], gateOpen:false, finishY:0, H:0};
    w.segs.push({ax:0,ay:hy,bx:exL,by:yBase});
    w.segs.push({ax:WW,ay:hy,bx:exR,by:yBase});
    w.gate = {ax:exL,ay:yBase,bx:exR,by:yBase};
    var B = {
      wall:function(pts,c,close){
        for(var i=0;i<pts.length-1;i++) w.segs.push({ax:X(pts[i][0]),ay:Y(pts[i][1]),bx:X(pts[i+1][0]),by:Y(pts[i+1][1]),c:c});
        if(close) w.segs.push({ax:X(pts[pts.length-1][0]),ay:Y(pts[pts.length-1][1]),bx:X(pts[0][0]),by:Y(pts[0][1]),c:c});
      },
      line:function(x1,y1,x2,y2,c){ w.segs.push({ax:X(x1),ay:Y(y1),bx:X(x2),by:Y(y2),c:c}); },
      peg:function(x,y,rp,c){ w.pegs.push({x:X(x),y:Y(y),r:Math.max(6,rp*k),c:c}); },
      bump:function(x,y,rp,c,ring){ w.bumpers.push({x:X(x),y:Y(y),r:Math.max(7,rp*k),c:c,ring:!!ring}); },
      spin:function(x,y,L,wv,c,a0){ w.spin.push({cx:X(x),cy:Y(y),L:L*k,a:(a0===undefined?rnd()*Math.PI:a0),w:(a0===undefined ? wv*(rnd()<.5?-1:1) : wv),c:c,ax:0,ay:0,bx:0,by:0}); },
      poly:function(pts,c,fill){ w.polys.push({pts:pts.map(function(p){return [X(p[0]),Y(p[1])];}),c:c,fill:!!fill}); }
    };
    def.build(B);
    w.finishY = Y(def.yEnd);
    w.H = w.finishY + 160;

    // 구슬 배치
    var order = S.people.slice();
    for(var i=order.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=order[i]; order[i]=order[j]; order[j]=t; }
    for(var q=0;q<order.length;q++){
      var row = Math.floor(q/cols), col = q%cols;
      var inRow = Math.min(cols, order.length-row*cols);
      var x0 = (WW - inRow*cell)/2 + cell/2;
      w.marbles.push({p:order[q], x:x0+col*cell+(rnd()-.5)*2, y:hy-r-4-row*cell+(rnd()-.5)*2, vx:0, vy:0, r:r, done:false, rank:0, still:0, fade:1});
    }
    physInit(w);
    W = w;
    S.phase = 'idle';
    cam = 0; camT = 0;
    $('ov').hidden = true;
    updateButtons();
    renderRank();
  }

  /* ---------- 물리 (Box2D / planck) ---------- */
  var SC = 30, H = 1/120;           // 30px = 1m
  function V(x,y){ return PL.Vec2(x,y); }
  function spinEnds(s){
    var c=Math.cos(s.a)*s.L, d=Math.sin(s.a)*s.L;
    s.ax=s.cx-c; s.ay=s.cy-d; s.bx=s.cx+c; s.by=s.cy+d;
  }
  function physInit(w){
    var wd = new PL.World({gravity:V(0,42)});
    w.pw = wd;
    var gnd = wd.createBody();
    function edge(body,ax,ay,bx,by){
      body.createFixture(PL.Edge(V(ax/SC,ay/SC),V(bx/SC,by/SC)),{friction:0.12,restitution:0.25});
    }
    edge(gnd,0,-800,0,w.H); edge(gnd,WW,-800,WW,w.H);
    w.segs.forEach(function(s){ edge(gnd,s.ax,s.ay,s.bx,s.by); });
    w.gateBody = wd.createBody();
    edge(w.gateBody,w.gate.ax,w.gate.ay,w.gate.bx,w.gate.by);
    w.polys.forEach(function(pl){
      var pts=pl.pts;
      for(var i=0;i<pts.length;i++){ var a=pts[i], b=pts[(i+1)%pts.length]; edge(gnd,a[0],a[1],b[0],b[1]); }
    });
    w.pegs.forEach(function(p){ gnd.createFixture(PL.Circle(V(p.x/SC,p.y/SC),p.r/SC),{friction:0.1,restitution:0.5}); });
    w.bumpers.forEach(function(p){ gnd.createFixture(PL.Circle(V(p.x/SC,p.y/SC),p.r/SC),{friction:0.05,restitution:0.9}); });
    w.spin.forEach(function(s){
      var b = wd.createKinematicBody({position:V(s.cx/SC,s.cy/SC),angle:s.a,angularVelocity:s.w});
      b.createFixture(PL.Box(s.L/SC,4/SC),{friction:0.25,restitution:0.3});
      s.body = b; spinEnds(s);
    });
    w.marbles.forEach(function(m){
      var b = wd.createDynamicBody({position:V(m.x/SC,m.y/SC),bullet:true,linearDamping:0.03,angularDamping:0.2});
      b.createFixture(PL.Circle(m.r/SC),{density:1,friction:0.12,restitution:0.45});
      m.body = b;
    });
  }
  function openGate(){
    if(W.gateOpen) return;
    W.gateOpen = true;
    if(W.gateBody){ W.pw.destroyBody(W.gateBody); W.gateBody = null; }
  }
  function step(dt){
    var w=W, ms=w.marbles, i;
    w.pw.step(dt,8,4);
    for(i=0;i<w.spin.length;i++){ var s=w.spin[i]; s.a=s.body.getAngle(); spinEnds(s); }
    var gone=[];
    for(i=0;i<ms.length;i++){
      var m=ms[i]; if(m.done) continue;
      var p=m.body.getPosition(), v=m.body.getLinearVelocity();
      m.x=p.x*SC; m.y=p.y*SC; m.vx=v.x*SC; m.vy=v.y*SC;
      if(S.phase==='run'){
        if(Math.abs(m.vx)+Math.abs(m.vy)<14 && m.y>w.hy+90){
          m.still+=dt;
          if(m.still>1.4){ m.body.applyLinearImpulse(V((rnd()-.5)*8,-(2+rnd()*3)),m.body.getWorldCenter()); m.still=0; }
        } else m.still=0;
        if(m.y>w.finishY){ m.done=true; m.rank=w.finished.length+1; w.finished.push(m); gone.push(m); }
      }
    }
    for(i=0;i<gone.length;i++){ w.pw.destroyBody(gone[i].body); gone[i].body=null; }
    if(gone.length) checkEnd();
  }
  function checkEnd(){
    var n=W.marbles.length, nw=Math.min(S.winners,n);
    var fin=W.finished.length;
    if((S.mode==='first' && fin>=nw) || fin>=n) finish();
    else if(S.mode==='last' && fin>=n-0) finish();
  }
  function finish(){
    if(S.phase!=='run') return;
    S.phase='done';
    var n=W.marbles.length, nw=Math.min(S.winners,n);
    var list = S.mode==='first' ? W.finished.slice(0,nw) : W.finished.slice(Math.max(0,W.finished.length-nw));
    showResult(list);
    updateButtons();
  }

  /* ---------- 결과 ---------- */
  var lastText = '';
  function avEl(p,cls){
    var d=document.createElement('span'); d.className='av'+(cls?' '+cls:''); d.style.setProperty('--c',p.color);
    if(p.imgData){ var im=document.createElement('img'); im.src=p.imgData; im.alt=''; d.appendChild(im); }
    else d.textContent = (p.name||'?').trim().charAt(0)||'?';
    return d;
  }
  function showResult(list){
    var box=$('winners'); box.textContent='';

    lastText = '구슬 뽑기 결과 ('+(MAPS.filter(function(x){return x.id===S.map})[0].name)+', '+(S.mode==='first'?'먼저 도착':'마지막 도착')+')\n'+lines.join('\n');
    $('copyBox').hidden=true;
    $('ov').hidden=false;
  }
  function toast(t){ $('toast').textContent=t; clearTimeout(toast.t); toast.t=setTimeout(function(){ $('toast').textContent=''; },2400); }

  /* ---------- 렌더 ---------- */
  var cam=0, camT=0, scale=1, cw=0, ch=0, dpr=1, frame=0;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    cw=cv.clientWidth; ch=cv.clientHeight;
    cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
    scale=cw/WW;
  }
  function col(c){ return (c&&COL[c])?COL[c]:T.wall; }
  function drawMarble(m){
    var p=m.p, x=m.x, y=m.y, r=m.r;
    ctx.save();
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.closePath();
    ctx.save(); ctx.clip();
    if(p.img && p.img.complete && p.img.naturalWidth){ ctx.drawImage(p.img,x-r,y-r,r*2,r*2); }
    else {
      ctx.fillStyle=p.color; ctx.fillRect(x-r,y-r,r*2,r*2);
      ctx.fillStyle='#fff'; ctx.font=(r*1.1)+'px Jua, "Noto Sans KR", sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText((p.name||'?').trim().charAt(0)||'?',x,y+r*0.06);
    }
    // 유리 구슬 느낌의 하이라이트
    var gr=ctx.createRadialGradient(x-r*.4,y-r*.45,r*.05,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,.45)'); gr.addColorStop(.35,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(0,0,0,.22)');
    ctx.fillStyle=gr; ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.restore();
    ctx.lineWidth=Math.max(2,r*.16); ctx.strokeStyle=p.color;
    ctx.beginPath(); ctx.arc(x,y,r-ctx.lineWidth/2+.5,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function drawNames(){
    if(W.r<8) return;
    ctx.font='700 '+Math.max(13,W.r*1.15)+'px "Noto Sans KR", sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.lineJoin='round'; ctx.lineWidth=3;
    for(var i=0;i<W.marbles.length;i++){
      var m=W.marbles[i]; if(m.done) continue;
      var y=m.y-m.r-4;
      if(y<cam-20||y>cam+ch/scale+20) continue;
      ctx.strokeStyle=T.stage; ctx.strokeText(m.p.name,m.x,y);
      ctx.fillStyle=T.ink; ctx.fillText(m.p.name,m.x,y);
    }
  }
  function render(){
    var w=W, viewH=ch/scale;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=T.stage; ctx.fillRect(0,0,cw,ch);
    ctx.save();
    ctx.scale(scale,scale); ctx.translate(0,-cam);
    var top=cam-40, bot=cam+viewH+40, i;

    // 벽
    ctx.fillStyle=T.wall; ctx.globalAlpha=.35; ctx.fillRect(-6,top,6,bot-top); ctx.fillRect(WW,top,6,bot-top); ctx.globalAlpha=1;

    // 벽과 선
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=6;
    for(i=0;i<w.segs.length;i++){ var s=w.segs[i]; if(Math.max(s.ay,s.by)<top||Math.min(s.ay,s.by)>bot) continue; ctx.strokeStyle=col(s.c); ctx.beginPath(); ctx.moveTo(s.ax,s.ay); ctx.lineTo(s.bx,s.by); ctx.stroke(); }
    // 다각형
    for(i=0;i<w.polys.length;i++){
      var pl=w.polys[i], pts=pl.pts, ymin=1e9, ymax=-1e9, q0;
      for(q0=0;q0<pts.length;q0++){ if(pts[q0][1]<ymin) ymin=pts[q0][1]; if(pts[q0][1]>ymax) ymax=pts[q0][1]; }
      if(ymax<top||ymin>bot) continue;
      ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
      for(q0=1;q0<pts.length;q0++) ctx.lineTo(pts[q0][0],pts[q0][1]);
      ctx.closePath();
      if(pl.fill){ ctx.fillStyle=col(pl.c); ctx.fill(); }
      ctx.strokeStyle=col(pl.c); ctx.lineWidth=6; ctx.stroke();
    }
    if(!w.gateOpen){ ctx.strokeStyle=T.accent; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(w.gate.ax,w.gate.ay); ctx.lineTo(w.gate.bx,w.gate.by); ctx.stroke(); }
    // 핀과 범퍼
    for(i=0;i<w.pegs.length;i++){ var p=w.pegs[i]; if(p.y<top||p.y>bot) continue; ctx.fillStyle=col(p.c); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill(); }
    for(i=0;i<w.bumpers.length;i++){ var b=w.bumpers[i]; if(b.y<top||b.y>bot) continue;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.2832);
      if(b.ring){ ctx.strokeStyle=col(b.c); ctx.lineWidth=Math.max(4,b.r*.28); ctx.stroke(); }
      else { ctx.fillStyle=col(b.c); ctx.fill(); ctx.strokeStyle=T.stage; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.55,0,6.2832); ctx.stroke(); }
    }
    // 회전 바
    ctx.lineWidth=8;
    for(i=0;i<w.spin.length;i++){ var sp=w.spin[i]; if(sp.cy<top-sp.L||sp.cy>bot+sp.L) continue; ctx.strokeStyle=col(sp.c); ctx.beginPath(); ctx.moveTo(sp.ax,sp.ay); ctx.lineTo(sp.bx,sp.by); ctx.stroke();
      ctx.fillStyle=T.stage; ctx.beginPath(); ctx.arc(sp.cx,sp.cy,3,0,6.2832); ctx.fill(); }
    // 도착선
    if(w.finishY>top-30 && w.finishY<bot+30){
      var q=14, fy=w.finishY;
      for(var cx=0,k=0;cx<WW;cx+=q,k++){ for(var rr=0;rr<2;rr++){ ctx.fillStyle=((k+rr)%2)?T.ink:T.stage; ctx.fillRect(cx,fy+rr*q,Math.min(q,WW-cx),q); } }
      ctx.strokeStyle=T.ink; ctx.lineWidth=1; ctx.strokeRect(0,fy,WW,q*2);
      ctx.fillStyle=T.muted; ctx.font='700 12px "Noto Sans KR", sans-serif'; ctx.textAlign='center'; ctx.fillText('도착',WW/2,fy+q*2+16);
    }
    // 구슬
    for(i=0;i<w.marbles.length;i++){ var m=w.marbles[i]; if(m.done) continue; if(m.y<top-40||m.y>bot+40) continue; drawMarble(m); }
    drawNames();
    ctx.restore();
  }

  /* ---------- 순위 / 카메라 ---------- */
  function renderRank(){
    var box=$('rank'); box.textContent='';
    if(S.phase==='idle') return;
    var list=W.finished.map(function(m,i){return {p:m.p,n:i+1}});
    var act=W.marbles.filter(function(m){return !m.done}).sort(function(a,b){return b.y-a.y});
    act.forEach(function(m,i){ list.push({p:m.p,n:W.finished.length+i+1}); });
    if(S.mode==='last'){ list=list.slice(-5).reverse().map(function(x){return x}); } else list=list.slice(0,5);
    list.forEach(function(x){
      var c=document.createElement('div'); c.className='chip';
      var b=document.createElement('b'); b.textContent=x.n; c.appendChild(b);
      c.appendChild(avEl(x.p));
      var t=document.createElement('span'); t.className='t'; t.textContent=x.p.name; c.appendChild(t);
      box.appendChild(c);
    });
  }
  function updateCamera(dtReal){
    var viewH=ch/scale, maxCam=Math.max(0,W.H-viewH);
    if(S.phase==='idle'){ camT=0; }
    else {
      var act=W.marbles.filter(function(m){return !m.done});
      if(act.length){
        var y;
        if(S.mode==='first'){ y=-1e9; act.forEach(function(m){ if(m.y>y) y=m.y; }); }
        else { y=1e9; act.forEach(function(m){ if(m.y<y) y=m.y; }); }
        camT=y-viewH*0.4;
      }
    }
    camT=clamp(camT,0,maxCam);
    cam+=(camT-cam)*Math.min(1,dtReal*4);
  }

  /* ---------- 루프 ---------- */
  var acc=0, lastT=0;
  function loop(ts){
    var dtReal=Math.min(0.05,(ts-lastT)/1000||0); lastT=ts; frame++;
    if(frame%90===1) readTheme();
    if(!cw||!ch) resize();
    scale=cw/WW;
    acc+=dtReal*(S.phase==='run'?S.speed:1);
    var guard=0;
    while(acc>=H && guard<40){ step(H); acc-=H; guard++; }
    if(guard>=40) acc=0;
    if(S.phase==='run' && frame%8===0) renderRank();
    updateCamera(dtReal);
    render();
    requestAnimationFrame(loop);
  }

  /* ---------- UI ---------- */
  function updateButtons(){
    var ok = S.people.length>=2;
    $('startBtn').disabled = !ok || S.phase!=='idle';
    $('startBtn').textContent = S.phase==='run' ? '진행 중…' : '구슬 떨어뜨리기';
    $('pcount').textContent = S.people.length+'명';
    $('wNum').max = Math.max(1,S.people.length);
    if(S.winners>S.people.length) { S.winners=Math.max(1,S.people.length); $('wNum').value=S.winners; }
  }
  function renderMaps(){
    var box=$('maps'); box.textContent='';
    MAPS.forEach(function(m){
      var b=document.createElement('button'); b.type='button'; b.setAttribute('aria-pressed',String(S.map===m.id));
      var a=document.createElement('strong'); a.textContent=m.name; b.appendChild(a);
      var s=document.createElement('small'); s.textContent=m.desc; b.appendChild(s);
      b.onclick=function(){ if(S.phase==='run') return; S.map=m.id; renderMaps(); buildWorld(); save(); };
      box.appendChild(b);
    });
  }
  function bindSeg(id,key,parse){
    var seg=$(id);
    function paint(){ Array.prototype.forEach.call(seg.children,function(b){ b.setAttribute('aria-pressed',String(String(S[key])===b.dataset.v)); }); }
    Array.prototype.forEach.call(seg.children,function(b){
      b.onclick=function(){ if(key==='mode' && S.phase==='run') return; S[key]=parse(b.dataset.v); paint(); save(); };
    });
    paint();
  }

  var pickTarget=null;
  function renderList(){
    var box=$('plist'); box.textContent='';
    S.people.forEach(function(p,idx){
      var row=document.createElement('div'); row.className='prow';
      var pick=document.createElement('button'); pick.type='button'; pick.className='pick'; pick.setAttribute('aria-label',p.name+' 이미지 선택');
      pick.appendChild(avEl(p));
      var plus=document.createElement('i'); plus.textContent='+'; pick.appendChild(plus);
      pick.onclick=function(){ pickTarget=p; $('oneFile').value=''; $('oneFile').click(); };
      row.appendChild(pick);
      var inp=document.createElement('input'); inp.type='text'; inp.value=p.name; inp.maxLength=20; inp.id='pn'+p.id; inp.setAttribute('aria-label',(idx+1)+'번째 참여자 이름');
      inp.oninput=function(){ p.name=inp.value; save(); };
      inp.onchange=function(){ if(!p.name.trim()){ p.name='참여자'+(idx+1); inp.value=p.name; } if(S.phase==='idle') {} renderList(); save(); };
      row.appendChild(inp);
      if(p.imgData){
        var cl=document.createElement('button'); cl.type='button'; cl.className='clr'; cl.textContent='이미지 삭제';
        cl.onclick=function(){ setImage(p,null); renderList(); save(); };
        row.appendChild(cl);
      }
      var x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='삭제'; x.setAttribute('aria-label',p.name+' 삭제');
      x.onclick=function(){ if(S.phase==='run') return; S.people.splice(idx,1); renderList(); resetWorldIfIdle(true); save(); };
      row.appendChild(x);
      box.appendChild(row);
    });
    updateButtons();
  }
  function resetWorldIfIdle(force){ if(S.phase!=='run' || force){ buildWorld(); } }

  function addPeople(names){
    var added=0;
    names.forEach(function(n){
      n=n.trim(); if(!n) return;
      if(S.people.length>=100) return;
      S.people.push(newPerson(n.slice(0,20))); added++;
    });
    if(added){ renderList(); resetWorldIfIdle(true); save(); }
    return added;
  }

  /* ---------- 이벤트 ---------- */
  $('addBtn').onclick=function(){ if(S.phase==='run') return; if(addPeople([$('addName').value])) $('addName').value=''; $('addName').focus(); };
  $('addName').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('addBtn').click(); } });
  $('bulkToggle').onclick=function(){ $('bulkBox').hidden=!$('bulkBox').hidden; };
  $('bulkAdd').onclick=function(){
    if(S.phase==='run') return;
    var n=addPeople($('bulkText').value.split(/\r?\n|,/));
    if(n){ $('bulkText').value=''; $('bulkBox').hidden=true; toast(n+'명을 추가했어요'); }
  };
  $('multiImg').onclick=function(){ $('multiFile').value=''; $('multiFile').click(); };
  $('oneFile').onchange=function(e){
    var f=e.target.files[0]; if(!f||!pickTarget) return;
    var p=pickTarget;
    fileToData(f).then(function(d){ setImage(p,d); renderList(); save(); }).catch(function(){ toast('이미지를 읽지 못했어요'); });
  };
  $('multiFile').onchange=function(e){
    var files=Array.prototype.slice.call(e.target.files||[]); if(!files.length) return;
    var made=0, matched=0;
    files.reduce(function(chain,f){
      return chain.then(function(){
        return fileToData(f).then(function(d){
          var base=f.name.replace(/\.[^.]+$/,'').trim();
          var p=S.people.filter(function(q){ return q.name.trim().toLowerCase()===base.toLowerCase(); })[0];
          if(p){ setImage(p,d); matched++; }
          else if(S.people.length<100){ var np=newPerson(base.slice(0,20)||'참여자'); setImage(np,d); S.people.push(np); made++; }
        }).catch(function(){});
      });
    },Promise.resolve()).then(function(){
      renderList(); resetWorldIfIdle(true); save();
      toast('이름이 맞는 '+matched+'명에 적용하고, 새 참여자 '+made+'명을 추가했어요');
    });
  };
  function setWinners(v){ v=parseInt(v,10); if(isNaN(v)) v=1; S.winners=clamp(v,1,Math.max(1,S.people.length)); $('wNum').value=S.winners; save(); }
  $('wMinus').onclick=function(){ setWinners(S.winners-1); };
  $('wPlus').onclick=function(){ setWinners(S.winners+1); };
  $('wNum').onchange=function(){ setWinners($('wNum').value); };

  $('startBtn').onclick=function(){
    if(S.phase!=='idle'||S.people.length<2) return;
    W.finished=[]; openGate(); S.phase='run'; updateButtons(); renderRank();
  };
  function again(){ buildWorld(); }
  $('resetBtn').onclick=again;
  $('againBtn').onclick=again;
  $('copyBtn').onclick=function(){
    var box=$('copyBox');
    function fallback(){ box.value=lastText; box.hidden=false; box.focus(); box.select(); toast('아래 글을 직접 복사해 주세요'); }
    try{
      navigator.clipboard.writeText(lastText).then(function(){ toast('결과를 복사했어요'); },fallback);
    }catch(e){ fallback(); }
  };


  /* ---------- GitHub / ZIP / 폴더 불러오기 ---------- */
  var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|avif)$/i;
  var BLOCK_MSG = '이 미리보기 화면에서는 GitHub에 직접 접속할 수 없어요. 저장소의 Code → Download ZIP으로 받은 파일을 "ZIP 불러오기"에 올려 주세요. GitHub Pages에 올린 페이지에서는 이 버튼으로 바로 불러옵니다.';
  function setMsg(t){ $('ghMsg').textContent = t; }
  function nameFromFile(path){
    var b = path.split('/').pop().replace(/\.[^.]+$/,'');
    b = b.replace(/^\d+[\s._-]+/,'').replace(/_+/g,' ').trim();
    return (b || path.split('/').pop()).slice(0,20);
  }
  function importBatch(entries, replace){
    if(S.phase==='run'){ setMsg('레이스가 끝난 뒤에 불러올 수 있어요.'); return Promise.resolve(0); }
    entries = entries.filter(function(e){ return IMG_RE.test(e.path) && !/(^|\/)(\.|__MACOSX)/.test(e.path); });
    entries.sort(function(a,b){ return a.path.localeCompare(b.path,'ko',{numeric:true}); });
    if(!entries.length){ setMsg('불러올 이미지가 없어요. png, jpg, gif, webp 파일이 필요해요.'); return Promise.resolve(0); }
    var list = replace ? [] : S.people.slice();
    var added = 0, skipped = 0, i = 0;
    function next(){
      if(i>=entries.length || list.length>=100) return Promise.resolve();
      var e = entries[i++];
      return fileToData(e.blob).then(function(d){
        var nm = nameFromFile(e.path);
        var hit = list.filter(function(q){ return q.name.trim().toLowerCase()===nm.toLowerCase(); })[0];
        if(hit) setImage(hit,d); else { var p = newPerson(nm); setImage(p,d); list.push(p); }
        added++;
      }).catch(function(){ skipped++; }).then(function(){
        if(i%5===0) setMsg(i+'/'+entries.length+' 불러오는 중…');
        return next();
      });
    }
    return next().then(function(){
      S.people = list; renderList(); resetWorldIfIdle(true); save();
      setMsg(added+'장을 불러왔어요'+(skipped?' ('+skipped+'장은 읽지 못함)':'')+'. 이름 칸을 눌러 바로 수정할 수 있어요.');
      return added;
    });
  }
  function parseGh(u){
    u = (u||'').trim().replace(/\/+$/,''); var m;
    if((m = u.match(/github\.com\/([^\/]+)\/([^\/#?]+)(?:\/(?:tree|blob)\/([^\/]+)(?:\/(.*))?)?/)))
      return {o:m[1], r:m[2].replace(/\.git$/,''), b:m[3]||'', p:m[4]||''};
    if((m = u.match(/^([\w.-]+)\/([\w.-]+)(?:\/(.*))?$/))) return {o:m[1], r:m[2], b:'', p:m[3]||''};
    return null;
  }
  function loadGithub(g, replace){
    setMsg('GitHub에서 목록을 가져오는 중…');
    var api = 'https://api.github.com/repos/'+g.o+'/'+g.r+'/contents/'+encodeURI(g.p)+(g.b?'?ref='+encodeURIComponent(g.b):'');
    return fetch(api,{headers:{Accept:'application/vnd.github+json'}}).then(function(res){
      if(res.status===404){ setMsg('폴더를 찾지 못했어요. 저장소가 공개(Public)인지, 주소와 브랜치 이름을 확인해 주세요.'); return null; }
      if(res.status===403){ setMsg('GitHub 요청 한도에 걸렸어요. 잠시 뒤 다시 시도하거나 ZIP으로 불러와 주세요.'); return null; }
      if(!res.ok){ setMsg('GitHub에서 목록을 가져오지 못했어요 ('+res.status+').'); return null; }
      return res.json();
    }).then(function(items){
      if(!items) return;
      if(!Array.isArray(items)) items = [items];
      var files = items.filter(function(it){ return it.type==='file' && IMG_RE.test(it.name) && it.download_url; }).slice(0,100);
      if(!files.length){ setMsg('이 폴더에서 이미지 파일을 찾지 못했어요.'); return; }
      var entries = [], idx = 0;
      function worker(){
        if(idx>=files.length) return Promise.resolve();
        var it = files[idx++];
        return fetch(it.download_url).then(function(r){ return r.blob(); }).then(function(b){ entries.push({path:it.name, blob:b}); }).catch(function(){}).then(worker);
      }
      var ws = []; for(var k=0;k<6;k++) ws.push(worker());
      return Promise.all(ws).then(function(){ return importBatch(entries, replace); });
    }).catch(function(){ setMsg(BLOCK_MSG); });
  }
  $('ghLoad').onclick = function(){
    var g = parseGh($('ghUrl').value);
    if(!g){ setMsg('주소 형식을 확인해 주세요. 예: https://github.com/아이디/저장소/tree/main/images'); return; }
    try{ localStorage.setItem('marblepick.gh', $('ghUrl').value); }catch(e){}
    loadGithub(g, $('replaceList').checked);
  };
  $('ghUrl').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('ghLoad').click(); } });
  $('zipBtn').onclick = function(){ $('zipFile').value=''; $('zipFile').click(); };
  $('zipFile').onchange = function(e){
    var f = e.target.files[0]; if(!f) return;
    if(!window.JSZip){ setMsg('ZIP 라이브러리를 불러오지 못했어요. 새로고침해 주세요.'); return; }
    setMsg('ZIP 파일을 여는 중…');
    JSZip.loadAsync(f).then(function(z){
      var keys = Object.keys(z.files).filter(function(k){ return !z.files[k].dir && IMG_RE.test(k); });
      var entries = [];
      return Promise.all(keys.map(function(k){ return z.files[k].async('blob').then(function(b){ entries.push({path:k, blob:b}); }); }))
        .then(function(){ return importBatch(entries, $('replaceList').checked); });
    }).catch(function(){ setMsg('ZIP 파일을 읽지 못했어요.'); });
  };
  $('dirBtn').onclick = function(){ $('dirFile').value=''; $('dirFile').click(); };
  $('dirFile').onchange = function(e){
    var fs = Array.prototype.slice.call(e.target.files||[]);
    importBatch(fs.map(function(f){ return {path:f.webkitRelativePath||f.name, blob:f}; }), $('replaceList').checked);
  };
  function autoGithub(){
    var h = location.hostname;
    if(!/\.github\.io$/.test(h)) return;
    var q = new URLSearchParams(location.search);
    var o = h.split('.')[0], r = (location.pathname.split('/')[1]||'') || (o+'.github.io');
    var g = {o:o, r:r, b:q.get('branch')||'', p:q.get('path')||'images'};
    $('ghUrl').value = 'https://github.com/'+o+'/'+r+'/tree/'+(g.b||'main')+'/'+g.p;
    loadGithub(g, true);
  }

  /* ---------- 시작 ---------- */
  var restored = load();
  if(!restored){ S.people=DEFAULT_NAMES.map(newPerson); }
  $('wNum').value=S.winners;
  renderMaps(); bindSeg('modeSeg','mode',String); bindSeg('speedSeg','speed',Number);
  renderList(); readTheme(); buildWorld();
  if(window.ResizeObserver){ new ResizeObserver(function(){ resize(); }).observe(cv); } else window.addEventListener('resize',resize);
  resize();
  try{ var sv=localStorage.getItem('marblepick.gh'); if(sv) $('ghUrl').value=sv; }catch(e){}
  if(!restored) autoGithub();
  requestAnimationFrame(loop);
})();
</script>
